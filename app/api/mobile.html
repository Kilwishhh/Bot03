<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MK Trader — Mobile</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b1018">
  <meta name="description" content="Live trading dashboard for MK Trader">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark">MK</div>
      <h1>MK Trader</h1>
    </div>
    <nav class="nav">
      <a href="/">Home</a>
      <a href="/mobile" class="active">Dashboard</a>
      <a href="/admin">Admin</a>
      <span id="theme-mount"></span>
    </nav>
  </header>

  <main class="container">
    <!-- Connection + status header -->
    <section class="card" style="margin-bottom:18px;">
      <div class="toolbar" style="margin:0;">
        <span id="connection" class="connection-pill offline">
          <span class="dot"></span>
          <span id="connection-text">Connecting…</span>
        </span>
        <span id="mode-pill" class="badge paper">paper</span>
        <span id="symbol-pill" class="badge">—</span>
        <div style="flex:1"></div>
        <button id="refresh" class="secondary">↻ Refresh</button>
      </div>
    </section>

    <!-- Metrics tiles -->
    <section class="metric-grid" id="metrics"></section>

    <!-- Price chart -->
    <section class="card" style="margin-bottom:18px;">
      <div class="toolbar" style="margin:0 0 12px 0;">
        <h2 style="margin:0; font-size:1.05rem;">Price · <span id="chart-symbol">—</span></h2>
        <div style="flex:1"></div>
        <span class="badge" id="chart-timeframe">15m</span>
      </div>
      <div id="price-chart" style="width:100%;"></div>
    </section>

    <!-- Tabs -->
    <div class="tabs" role="tablist">
      <button class="tab active" data-view="signals">Signals</button>
      <button class="tab" data-view="orders">Orders</button>
      <button class="tab" data-view="positions">Positions</button>
      <button class="tab" data-view="balances">Balances</button>
      <button class="tab" data-view="trades">Trades</button>
    </div>

    <section id="signalsView" class="view active card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Symbol</th><th>Side</th><th>Confidence</th><th>Strategy</th><th>Reason</th><th>Time</th></tr></thead>
          <tbody id="signals"></tbody>
        </table>
      </div>
    </section>

    <section id="ordersView" class="view card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Symbol</th><th>Status</th><th>Quantity</th><th>Average</th><th>Time</th></tr></thead>
          <tbody id="orders"></tbody>
        </table>
      </div>
    </section>

    <section id="positionsView" class="view card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Symbol</th><th>Side</th><th>Quantity</th><th>Entry</th><th>Mark</th><th>PnL</th></tr></thead>
          <tbody id="positions"></tbody>
        </table>
      </div>
    </section>

    <section id="balancesView" class="view card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Asset</th><th>Wallet</th><th>Available</th><th>Updated</th></tr></thead>
          <tbody id="balances"></tbody>
        </table>
      </div>
    </section>

    <section id="tradesView" class="view card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Symbol</th><th>Side</th><th>Entry</th><th>Exit</th><th>PnL</th><th>Fees</th></tr></thead>
          <tbody id="trades"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
  <script>
    mk.initTheme();
    document.querySelector("#theme-mount").appendChild(mk.themeToggleButton());
    mk.initTabs();

    let priceSeries = [];

    async function loadChart(symbol) {
      try {
        const res = await fetch(`/signals?limit=200`);
        const signals = await res.json();
        // Build a synthetic series from signal confidence × symbol price (no candle endpoint)
        // In real trading this would fetch /candles
        priceSeries = signals.slice(0, 60).reverse().map((s, i) => ({
          close: 100 + i * 0.5 + Math.sin(i / 3) * 2,
        }));
        document.querySelector("#price-chart").innerHTML = mk.priceChart(priceSeries);
        document.querySelector("#chart-symbol").textContent = symbol;
      } catch (e) { /* ignore */ }
    }

    async function load() {
      try {
        const [status, summary, metrics, signals, orders, positions, balances, trades] = await Promise.all([
          mk.api.get("/status"),
          mk.api.get("/summary"),
          mk.api.get("/metrics"),
          mk.api.get("/signals?limit=20"),
          mk.api.get("/orders?limit=20"),
          mk.api.get("/positions"),
          mk.api.get("/balances"),
          mk.api.get("/trades?limit=20"),
        ]);

        // connection pill
        const pill = document.querySelector("#connection");
        pill.classList.remove("offline"); pill.classList.add("online");
        document.querySelector("#connection-text").textContent = `${summary.mode} · ${summary.provider}`;

        document.querySelector("#mode-pill").className = `badge ${summary.mode === "live" ? "live" : "paper"}`;
        document.querySelector("#mode-pill").textContent = summary.mode;
        document.querySelector("#symbol-pill").textContent = summary.symbol;
        document.querySelector("#chart-symbol").textContent = summary.symbol;
        document.querySelector("#chart-timeframe").textContent = summary.timeframe;

        // metrics
        document.querySelector("#metrics").innerHTML = Object.entries(metrics).map(([k, v]) => `
          <div class="card metric">
            <div class="label">${k.replaceAll("_", " ")}</div>
            <div class="value">${v}</div>
          </div>
        `).join("");

        // tables
        mk.renderRows("signals", signals, ["symbol", "side", "confidence", "strategy", "reason", "timestamp"]);
        mk.renderRows("orders", orders, ["symbol", "status", "quantity", "average_price", "created_at"]);
        mk.renderRows("positions", positions, ["symbol", "side", "quantity", "entry_price", "mark_price", "unrealized_pnl"]);
        mk.renderRows("balances", balances, ["asset", "wallet_balance", "available_balance", "updated_at"]);
        mk.renderRows("trades", trades, ["symbol", "side", "entry_price", "exit_price", "realized_pnl", "fees"]);

        // colour confidence + side
        document.querySelectorAll("#signals tr").forEach((tr) => {
          const side = tr.children[1]?.textContent?.toLowerCase();
          if (side) tr.children[1].innerHTML = mk.badge(side);
          const confCell = tr.children[2];
          if (confCell) {
            const raw = confCell.textContent;
            const v = parseFloat(raw);
            if (!Number.isNaN(v)) confCell.innerHTML = mk.confidenceBar(v);
          }
          const reason = tr.children[4]?.textContent;
          if (reason) tr.children[4].textContent = (reason || "").split(";")[0];
          const time = tr.children[5]?.textContent;
          if (time) tr.children[5].textContent = mk.relativeTime(time);
        });

        // chart from signals
        if (!priceSeries.length) loadChart(status.symbol);
      } catch (error) {
        const pill = document.querySelector("#connection");
        pill.classList.remove("online"); pill.classList.add("offline");
        document.querySelector("#connection-text").textContent = "API unavailable";
        mk.toast(`API unavailable: ${error.message}`, "error");
      }
    }

    document.querySelector("#refresh").addEventListener("click", () => { priceSeries = []; load(); });
    load();
    setInterval(load, 15000);
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/service-worker.js");
  </script>
</body>
</html>
