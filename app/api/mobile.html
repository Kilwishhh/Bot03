<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crypto Bot</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101418; color: #edf2f7; }
    body { margin: 0; padding: 20px; max-width: 980px; margin-inline: auto; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    h1 { font-size: 1.35rem; margin: 0; } .muted { color: #9aa8b8; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 20px 0; }
    .tile, .panel { background: #19212a; border: 1px solid #2b3744; padding: 16px; border-radius: 8px; }
    .value { font-size: 1.4rem; font-weight: 700; margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; } th, td { text-align: left; padding: 9px 6px; border-bottom: 1px solid #2b3744; }
    button { border: 0; border-radius: 6px; padding: 9px 12px; background: #3aa675; color: white; cursor: pointer; }
    .tabs { display: flex; gap: 8px; overflow-x: auto; margin: 20px 0 12px; padding-bottom: 4px; }
    .tab { background: #26313c; white-space: nowrap; }
    .tab.active { background: #3aa675; }
    .view { display: none; }
    .view.active { display: block; }
    .table-wrap { overflow-x: auto; }
    .empty { color: #9aa8b8; }
    .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 10px; margin-top: 12px; }
    .status-grid div { background: #101820; padding: 11px; border-radius: 6px; }
    @media (min-width: 560px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  </style>
</head>
<body>
  <header><div><h1>Crypto Trading Bot</h1><div id="status" class="muted">Loading...</div></div><button onclick="load()">Refresh</button></header>
  <section class="grid" id="metrics"></section>
  <h2>System summary</h2>
  <div class="tile" id="summary" style="margin-bottom:16px;"></div>
  <div class="tabs" role="tablist">
    <button class="tab active" data-view="signals">Signals</button>
    <button class="tab" data-view="orders">Orders</button>
    <button class="tab" data-view="positions">Positions</button>
    <button class="tab" data-view="balances">Balances</button>
    <button class="tab" data-view="trades">Trades</button>
  </div>
  <section id="signalsView" class="panel view active"><h2>Recent signals</h2><div class="table-wrap"><table><thead><tr><th>Symbol</th><th>Side</th><th>Confidence</th><th>Strategy</th></tr></thead><tbody id="signals"></tbody></table></div></section>
  <section id="ordersView" class="panel view"><h2>Recent orders</h2><div class="table-wrap"><table><thead><tr><th>Symbol</th><th>Status</th><th>Quantity</th><th>Average</th></tr></thead><tbody id="orders"></tbody></table></div></section>
  <section id="positionsView" class="panel view"><h2>Open positions</h2><div class="table-wrap"><table><thead><tr><th>Symbol</th><th>Side</th><th>Quantity</th><th>PnL</th></tr></thead><tbody id="positions"></tbody></table></div></section>
  <section id="balancesView" class="panel view"><h2>Balances</h2><div class="table-wrap"><table><thead><tr><th>Asset</th><th>Wallet</th><th>Available</th></tr></thead><tbody id="balances"></tbody></table></div></section>
  <section id="tradesView" class="panel view"><h2>Trade history</h2><div class="table-wrap"><table><thead><tr><th>Symbol</th><th>Side</th><th>Realized PnL</th><th>Fees</th></tr></thead><tbody id="trades"></tbody></table></div></section>
  <script>
    async function get(path) { const response = await fetch(path); if (!response.ok) throw new Error(response.status); return response.json(); }
    function escapeHtml(value) { return String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character])); }
    function renderRows(id, rows, columns) {
      document.querySelector(`#${id}`).innerHTML = rows.length ? rows.map(row => `<tr>${columns.map(column => `<td>${escapeHtml(row[column])}</td>`).join('')}</tr>`).join('') : `<tr><td class="empty" colspan="${columns.length}">No records yet</td></tr>`;
    }
    async function load() {
      try {
        const [status, summary, metrics, signals, orders, positions, balances, trades] = await Promise.all([
          get('/status'),
          get('/summary'),
          get('/metrics'),
          get('/signals?limit=10'),
          get('/orders?limit=10'),
          get('/positions'),
          get('/balances'),
          get('/trades?limit=10')
        ]);
        const summaryText = `${summary.mode} · ${summary.provider} · ${summary.symbol} · ${summary.timeframe}`;
        document.querySelector('#status').textContent = summaryText;
        document.querySelector('#summary').innerHTML = `<strong>Healthy:</strong> ${summary.healthy} · <strong>Remote control:</strong> ${summary.remote_control_enabled} · <strong>Live trading:</strong> ${summary.live_trading_enabled}<div class="status-grid"><div><span class="muted">Mode</span><br><strong>${escapeHtml(summary.mode)}</strong></div><div><span class="muted">Provider</span><br><strong>${escapeHtml(summary.provider)}</strong></div><div><span class="muted">Symbol</span><br><strong>${escapeHtml(summary.symbol)}</strong></div><div><span class="muted">Timeframe</span><br><strong>${escapeHtml(summary.timeframe)}</strong></div></div>`;
        document.querySelector('#metrics').innerHTML = Object.entries(metrics).map(([key, value]) => `<div class="tile"><div class="muted">${key.replaceAll('_', ' ')}</div><div class="value">${value}</div></div>`).join('');
        renderRows('signals', signals, ['symbol', 'side', 'confidence', 'strategy']);
        renderRows('orders', orders, ['symbol', 'status', 'quantity', 'average_price']);
        renderRows('positions', positions, ['symbol', 'side', 'quantity', 'unrealized_pnl']);
        renderRows('balances', balances, ['asset', 'wallet_balance', 'available_balance']);
        renderRows('trades', trades, ['symbol', 'side', 'realized_pnl', 'fees']);
      } catch (error) { document.querySelector('#status').textContent = `API unavailable: ${error.message}`; }
    }
    document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(item => item.classList.remove('active'));
      document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
      tab.classList.add('active');
      document.querySelector(`#${tab.dataset.view}View`).classList.add('active');
    }));
    load();
    setInterval(load, 15000);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js');
  </script>
</body>
</html>
