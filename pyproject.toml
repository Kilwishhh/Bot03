[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trading-bot"
version = "0.1.0"
description = "Modular, safety-first Binance crypto trading framework"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "python-binance>=1.0.19,<2",
  "pandas>=2.0,<3",
  "numpy>=1.26,<3",
  "rich>=13.7,<14",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9", "pytest-asyncio>=0.23,<1", "httpx>=0.27,<1"]
dashboard = ["streamlit>=1.35,<2"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1"]
prometheus = ["prometheus-client>=0.20,<1"]

[project.scripts]
crypto-bot = "app.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
