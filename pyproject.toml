[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trading-bot"
version = "0.1.0"
description = "Modular, safety-first Binance crypto trading framework"
# Supported Python versions, frozen at release time. CI tests on 3.11 and 3.13.
# Bump together with the CI matrix in .github/workflows/ci.yml.
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "python-binance>=1.0.19,<2",
  "pandas>=2.0,<3",
  "numpy>=1.26,<3",
  "rich>=13.7,<14",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9", "pytest-asyncio>=0.23,<1", "httpx>=0.27,<1"]
dashboard = ["streamlit>=1.35,<2"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1"]
prometheus = ["prometheus-client>=0.20,<1"]
dev = ["ruff>=0.5,<1"]

[project.scripts]
crypto-bot = "app.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["mobile", "build", "dist", ".venv"]

[tool.ruff.lint]
# Conservative set: catch real bugs and style issues without blocking the
# pre-existing codebase on nits.
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
  "E501",   # line length is handled by formatter
  "B008",   # function call in default argument (FastAPI Depends uses this)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]  # tests can use broad exception handling

