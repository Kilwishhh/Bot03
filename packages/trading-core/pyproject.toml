[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-core"
version = "0.1.0"
description = "Pluggable strategy, signal, risk, execution, portfolio and backtesting core"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["trading_core"]
