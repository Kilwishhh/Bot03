[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exchange"
version = "0.1.0"
description = "ExchangeAdapter interface and implementations (CCXT Binance USD-M Futures, paper)"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.3",
    "pydantic>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["exchange"]
