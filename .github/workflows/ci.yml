name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Single source of truth for CI. Runs on every push and PR.
# Phases: (1) lint, (2) unit tests on Python 3.11 + 3.13, (3) offline
# smoke, (4) dependency audit, (5) secret scan, (6) Docker build + container
# smoke, (7) Compose validation, (8) conventional-commits PR title check.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint ───────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        # E/F = pycodestyle/pyflakes, I = isort, B = bugbear, UP = pyupgrade.
        run: ruff check app tests scripts

  # ── 2. Tests ──────────────────────────────────────────────────────────────
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[test,api]"
      - name: Pytest
        run: pytest -q --tb=short
      - name: Offline smoke
        run: python scripts/check_app.py

  # ── 3. Dependency audit ───────────────────────────────────────────────────
  dep-audit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[test,api]"
      - name: Dependency audit
        run: python scripts/audit_dependencies.py

  # ── 4. Secret scanning (Gitleaks) ─────────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan full history for committed secrets
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-format: "yaml"
          config-path: ".gitleaks.toml"
          log-level: "info"
          sentinel: ".gitleaks-report.json"
      - name: Fail if secrets found
        run: |
          if [ -f .gitleaks-report.json ] && grep -q '"found":true' .gitleaks-report.json; then
            echo "Gitleaks found secrets — see .gitleaks-report.json"
            cat .gitleaks-report.json | python -m json.tool | head -50
            exit 1
          fi
          echo "No secrets detected by Gitleaks"

  # ── 5. Docker build + container smoke ────────────────────────────────────
  docker:
    name: Docker build + smoke
    runs-on: ubuntu-latest
    needs: [test, dep-audit, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t mktrader:ci -f Dockerfile .
      - name: Start container (paper mode, no creds)
        run: |
          docker run -d --name mktrader-ci -p 8000:8000 \
            -e TRADING_MODE=paper \
            -e DATABASE_PATH=/app/data/trading.db \
            mktrader:ci
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "up after ${i}s"
              break
            fi
            sleep 1
          done
      - name: Container smoke
        run: python scripts/docker_smoke.py
      - if: always()
        run: docker logs mktrader-ci || true
      - if: always()
        run: docker rm -f mktrader-ci || true

  # ── 6. Docker Compose validation ─────────────────────────────────────────
  compose:
    name: Docker Compose validate
    runs-on: ubuntu-latest
    needs: [test, dep-audit, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Compose config
        run: docker compose config -q
      - name: Compose up + smoke
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "up after ${i}s"
              break
            fi
            sleep 1
          done
          python scripts/docker_smoke.py
      - if: always()
        run: docker compose down --remove-orphans || true

  # ── 7. Conventional commits (PR title only) ───────────────────────────────
  conventional-commits:
    runs-on: ubuntu-latest
    # Only run on PRs, not on push to master
    if: github.event_name == 'pull_request'
    needs: [test, dep-audit, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Check PR title
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "PR title: $TITLE"
          # Accept: feat(scope):, fix(scope):, chore(scope):, docs(scope):,
          #       test(scope):, refactor(scope):, perf(scope):, ci(scope):,
          #       build(scope):, style(scope):, revert(scope):, feat!, fix!, chore!, docs!
          if echo "$TITLE" | grep -qE '^(feat|fix|chore|docs|test|refactor|perf|ci|build|style|revert)(\([a-z0-9_-]+\))?!?:'; then
            echo "PASS: conventional commit format"
          else
            echo "FAIL: PR title does not follow conventional commits"
            echo "Expected: feat(scope): description  or  fix(scope): description  etc."
            echo "Example:  feat(admin): add signals list to dashboard"
            exit 1
          fi
