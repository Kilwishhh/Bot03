name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test,api]"
      - run: pytest -q
      - run: python scripts/check_app.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mk-trader-ci .
      - run: docker run -d --name mk-trader-api -p 8000:8000 -e TRADING_MODE=paper mk-trader-ci
      - run: python -m pip install httpx2
      - run: python scripts/docker_smoke.py
      - if: always()
        run: docker logs mk-trader-api || true
      - if: always()
        run: docker rm -f mk-trader-api || true