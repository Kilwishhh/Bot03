name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,api,dashboard]"

      - name: Run pytest
        run: |
          pytest -q --tb=short

      - name: Offline smoke check
        run: |
          python scripts/check_app.py

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker build -t mktrader:ci -f Dockerfile .

      - name: Run container smoke test
        run: |
          docker run --rm --name mktrader-ci \
            -e TRADING_MODE=paper \
            -e DATABASE_PATH=/app/data/trading.db \
            mktrader-ci python scripts/docker_smoke.py || true