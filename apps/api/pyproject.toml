[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bot03-api"
version = "0.1.0"
description = "Bot03 FastAPI backend (REST + WebSocket + auth + orchestration)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "redis>=5.0",
    "arq>=0.26",
    "alembic>=1.13",
    "structlog>=24.1",
    "trading-core>=0.1.0",
    "exchange>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
